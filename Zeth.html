}],"sprites":[]},{"id":"prologfin","name":"","note":"","bg":"images/backs/prologfin.jpg","mode":"first","music":"","ambient":"","startPx":150,"playerY":700,"playerScale":1,"walkMin":70,"walkMax":1080,"limitIf":"","limitMin":null,"limitMax":null,"walkThroughPlayer":0,"preset":null,"bubbleX":null,"bubbleY":null,"onEnter":[{"if":"","who":"zet","text":"","bx":null,"by":null,"act":[{"t":"say","who":"zet","text":"Ух. Ещё пару этажей пройти"},{"t":"say","who":"rodion","text":"Доброй ночи, Зет"},{"t":"say","who":"zet","text":"А-А-А-А-А-А-А-А!"},{"t":"say","who":"zet","text":"Конец пролога"}]}],"zones":[],"arrows":[],"sprites":[]}],"puzzleTypes":[{"type":"custom2","code":"// Тип головоломки: функция (p, A, params) → объект-экземпляр. Спецификация — «? Справка» и документ для разработчика.\n// Тип головоломки: keymaster\n// Зажать круглую головку ключа, повернуть её вниз по дуге и отпустить,\n// когда внутри замка появится короткий металлический щелчок.\n(p, A, params) => {\n  const cx = A.area.w / 2;\n  const cy = 345;\n  const maxTurn = 1.16;\n  const targets = [0.34, 0.70, 1.04];\n  const tolerances = [0.060, 0.052, 0.045];\n  const keyRadius = 207;\n\n  let stage = 0;\n  let angle = 0;\n  let dragging = false;\n  let springBack = false;\n  let near = false;\n  let clock = 0;\n  let message = 'Зажми круглую головку ключа и медленно поверни вниз';\n\n  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));\n  const rounded = (x, y, w, h, r) => {\n    g.beginPath();\n    g.moveTo(x + r, y);\n    g.arcTo(x + w, y, x + w, y + h, r);\n    g.arcTo(x + w, y + h, x, y + h, r);\n    g.arcTo(x, y + h, x, y, r);\n    g.arcTo(x, y, x + w, y, r);\n    g.closePath();\n  };\n  const tone = (freqs, type, dur, vol, slide) => {\n    try { A.tone(freqs, type || 'sine', dur || 0.1, vol == null ? 0.07 : vol, slide); } catch (e) {}\n  };\n  const sayHint = (text, seconds) => {\n    message = text;\n  };\n  const target = () => targets[Math.min(stage, 2)];\n  const tolerance = () => tolerances[Math.min(stage, 2)];\n  const handlePos = () => ({\n    x: cx - keyRadius * Math.cos(angle),\n    y: cy + keyRadius * Math.sin(angle)\n  });\n  const pointerAngle = (x, y) => {\n    const raw = Math.atan2(y - cy, x - cx);\n    return clamp(Math.PI - raw, 0, maxTurn);\n  };\n\n  function drawBackground() {\n    const grad = g.createRadialGradient(cx, 300, 60, cx, 330, 700);\n    grad.addColorStop(0, '#3a3021');\n    grad.addColorStop(0.58, '#211b13');\n    grad.addColorStop(1, '#0b0907');\n    g.fillStyle = grad;\n    g.fillRect(0, 0, A.area.w, A.area.h);\n\n    g.save();\n    g.globalAlpha = 0.22;\n    g.strokeStyle = '#8a6940';\n    g.lineWidth = 2;\n    for (let y = 18; y \u003c 735; y += 47) {\n      g.beginPath(); g.moveTo(0, y); g.lineTo(1152, y + Math.sin(y) * 3); g.stroke();\n    }\n    for (let x = 35; x \u003c 1152; x += 190) {\n      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 8, 745); g.stroke();\n    }\n    g.restore();\n  }\n\n  function drawLockPlate() {\n    const plate = g.createLinearGradient(cx - 230, cy - 210, cx + 230, cy + 220);\n    plate.addColorStop(0, '#877044');\n    plate.addColorStop(0.22, '#3d3528');\n    plate.addColorStop(0.52, '#201d18');\n    plate.addColorStop(0.82, '#55452e');\n    plate.addColorStop(1, '#17140f');\n    g.fillStyle = '#070605';\n    rounded(cx - 245, cy - 220, 490, 445, 32); g.fill();\n    g.fillStyle = plate;\n    rounded(cx - 235, cy - 215, 470, 430, 28); g.fill();\n    g.strokeStyle = '#b39459'; g.lineWidth = 4;\n    rounded(cx - 226, cy - 206, 452, 412, 23); g.stroke();\n    g.strokeStyle = '#17130d'; g.lineWidth = 2;\n    rounded(cx - 214, cy - 194, 428, 388, 18); g.stroke();\n\n    [[cx - 190, cy - 165], [cx + 190, cy - 165], [cx - 190, cy + 165], [cx + 190, cy + 165]].forEach(([x, y]) => {\n      const rg = g.createRadialGradient(x - 3, y - 4, 1, x, y, 12);\n      rg.addColorStop(0, '#d8bd7c'); rg.addColorStop(1, '#47351d');\n      g.fillStyle = rg; g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.fill();\n      g.strokeStyle = '#17120b'; g.lineWidth = 2; g.stroke();\n      g.beginPath(); g.moveTo(x - 5, y + 4); g.lineTo(x + 5, y - 4); g.stroke();\n    });\n\n    const cg = g.createRadialGradient(cx - 25, cy - 35, 8, cx, cy, 105);\n    cg.addColorStop(0, '#b79a60');\n    cg.addColorStop(0.35, '#675331');\n    cg.addColorStop(0.72, '#2b251b');\n    cg.addColorStop(1, '#090807');\n    g.fillStyle = cg; g.beginPath(); g.arc(cx, cy, 106, 0, Math.PI * 2); g.fill();\n    g.strokeStyle = '#c3a66b'; g.lineWidth = 7; g.stroke();\n    g.strokeStyle = '#19140d'; g.lineWidth = 3;\n    g.beginPath(); g.arc(cx, cy, 91, 0, Math.PI * 2); g.stroke();\n\n    const hg = g.createRadialGradient(cx - 8, cy - 12, 2, cx, cy, 65);\n    hg.addColorStop(0, '#090909'); hg.addColorStop(0.7, '#17130e'); hg.addColorStop(1, '#050505');\n    g.fillStyle = hg; g.beginPath(); g.arc(cx, cy, 65, 0, Math.PI * 2); g.fill();\n    g.strokeStyle = '#8c7243'; g.lineWidth = 3; g.stroke();\n\n    g.fillStyle = '#020202';\n    g.beginPath(); g.ellipse(cx, cy - 2, 18, 34, 0, 0, Math.PI * 2); g.fill();\n    g.beginPath(); g.arc(cx, cy + 25, 23, 0, Math.PI * 2); g.fill();\n\n    g.textAlign = 'center'; g.textBaseline = 'middle';\n    g.fillStyle = '#bda16b'; g.font = 'bold 17px Georgia, serif';\n    g.fillText('MECHANICAL LOCK', cx, cy - 166);\n    g.fillStyle = '#74603e'; g.font = '12px Georgia, serif';\n    g.fillText('NO FORCE — FEEL THE CLICK', cx, cy + 178);\n    g.textAlign = 'left'; g.textBaseline = 'alphabetic';\n  }\n\n  function drawKey() {\n    const shakeX = near && dragging ? Math.sin(clock * 58) * 2.2 : 0;\n    const shakeY = near && dragging ? Math.cos(clock * 63) * 2.2 : 0;\n    g.save();\n    g.translate(cx + shakeX, cy + shakeY);\n    g.rotate(-angle);\n\n    const gold = g.createLinearGradient(-220, -45, 110, 40);\n    gold.addColorStop(0, '#6b4b1f');\n    gold.addColorStop(0.25, '#e1c17a');\n    gold.addColorStop(0.52, '#9a7436');\n    gold.addColorStop(0.78, '#f0d58d');\n    gold.addColorStop(1, '#765222');\n\n    g.fillStyle = '#17120b';\n    rounded(-174, -17, 274, 34, 8); g.fill();\n    g.fillStyle = gold;\n    rounded(-177, -14, 270, 27, 7); g.fill();\n    g.strokeStyle = '#f0d28a'; g.lineWidth = 2; g.stroke();\n\n    g.fillStyle = '#6f4d20';\n    g.fillRect(36, 8, 19, 25);\n    g.fillRect(66, 8, 18, 18);\n    g.fillStyle = '#d9b66c';\n    g.fillRect(39, 7, 12, 5);\n    g.fillRect(69, 7, 12, 5);\n    g.fillStyle = gold;\n    rounded(87, -10, 20, 20, 5); g.fill();\n\n    g.lineWidth = 18; g.strokeStyle = '#17120b';\n    g.beginPath(); g.arc(-211, 0, 43, 0, Math.PI * 2); g.stroke();\n    g.lineWidth = 13; g.strokeStyle = gold;\n    g.beginPath(); g.arc(-211, 0, 43, 0, Math.PI * 2); g.stroke();\n    g.lineWidth = 3; g.strokeStyle = '#f2d895';\n    g.beginPath(); g.arc(-211, 0, 35, 0, Math.PI * 2); g.stroke();\n    g.fillStyle = '#18130d'; g.beginPath(); g.arc(-211, 0, 24, 0, Math.PI * 2); g.fill();\n    g.strokeStyle = '#9b783f'; g.lineWidth = 2; g.stroke();\n\n    g.fillStyle = '#f4dda0'; g.beginPath(); g.arc(-211, -42, 4, 0, Math.PI * 2); g.fill();\n    g.restore();\n\n    const hp = handlePos();\n    if (dragging || near) {\n      g.save();\n      g.strokeStyle = near ? '#f2d27a' : '#b99a5e';\n      g.globalAlpha = near ? 0.75 : 0.35;\n      g.lineWidth = near ? 5 : 3;\n      g.beginPath(); g.arc(hp.x, hp.y, 55, 0, Math.PI * 2); g.stroke();\n      g.restore();\n    }\n  }\n\n  function drawTurnArc() {\n    const r = 255;\n    g.save();\n    g.lineCap = 'round';\n    g.strokeStyle = 'rgba(220,190,125,.22)'; g.lineWidth = 7;\n    g.beginPath(); g.arc(cx, cy, r, Math.PI, Math.PI - maxTurn, true); g.stroke();\n    if (angle > 0.005) {\n      g.strokeStyle = near ? '#f2d27a' : '#b99352';\n      g.lineWidth = 8;\n      g.beginPath(); g.arc(cx, cy, r, Math.PI, Math.PI - angle, true); g.stroke();\n    }\n    const mx = cx + r * Math.cos(Math.PI - angle);\n    const my = cy + r * Math.sin(Math.PI - angle);\n    g.fillStyle = near ? '#fff0b0' : '#c5a467';\n    g.beginPath(); g.arc(mx, my, near ? 9 : 6, 0, Math.PI * 2); g.fill();\n    g.restore();\n  }\n\n  function drawProgress() {\n    const y = 590;\n    g.textAlign = 'center'; g.textBaseline = 'middle';\n    g.fillStyle = '#d6c49d'; g.font = '18px Georgia, serif';\n    g.fillText('ВНУТРЕННИЕ ФИКСАТОРЫ', cx, y - 38);\n    for (let i = 0; i \u003c 3; i++) {\n      const x = cx - 92 + i * 92;\n      const done = i \u003c stage;\n      const active = i === stage && !A.solved();\n      g.save();\n      g.fillStyle = done ? '#d9b66c' : active ? '#57482c' : '#211d17';\n      g.strokeStyle = done ? '#f5d994' : active ? '#c09b58' : '#6f5b39';\n      g.lineWidth = active ? 4 : 2;\n      g.beginPath(); g.arc(x, y, 22, 0, Math.PI * 2); g.fill(); g.stroke();\n      g.fillStyle = done ? '#21190c' : '#d6c49d';\n      g.font = 'bold 17px Georgia, serif';\n      g.fillText(done ? '✓' : String(i + 1), x, y + 1);\n      g.restore();\n    }\n    g.textAlign = 'left'; g.textBaseline = 'alphabetic';\n  }\n\n  function drawMessage() {\n    const solved = A.solved();\n    const text = solved ? 'Замок открылся! Нажми ВЫХОД.' : message;\n    const color = solved ? '#e8ca83' : near ? '#ffe6a0' : '#d5c6a5';\n    g.save();\n    g.fillStyle = 'rgba(5,4,3,.78)';\n    rounded(190, 640, 772, 58, 12); g.fill();\n    g.strokeStyle = near || solved ? '#c4a365' : '#55472f';\n    g.lineWidth = 2; g.stroke();\n    g.fillStyle = color;\n    g.font = solved ? 'bold 23px Georgia, serif' : '20px Georgia, serif';\n    g.textAlign = 'center'; g.textBaseline = 'middle';\n    g.fillText(text, cx, 669);\n    g.restore();\n  }\n\n  return {\n    open() {\n      dragging = false;\n      near = false;\n      springBack = false;\n      if (A.solved()) {\n        stage = 3;\n        angle = maxTurn;\n      } else {\n        stage = 0;\n        angle = 0;\n        sayHint('Зажми круглую головку ключа и медленно поверни вниз', 0);\n      }\n    },\n\n    click(x, y) {\n      if (A.solved() || springBack) return;\n      const hp = handlePos();\n      if (Math.hypot(x - hp.x, y - hp.y) \u003c= 68) {\n        dragging = true;\n        near = false;\n        sayHint('Поворачивай медленно. Слушай механизм…', 0);\n      } else {\n        sayHint('Возьмись мышью за круглую головку ключа', 1.8);\n      }\n    },\n\n    move(x, y) {\n      if (!dragging || A.solved()) return;\n      angle = pointerAngle(x, y);\n      const close = Math.abs(angle - target()) \u003c= tolerance();\n      if (close && !near) {\n        tone([740, 980], 'sine', 0.085, 0.075);\n        sayHint('Есть щелчок! Отпусти ключ.', 0);\n      } else if (!close && near) {\n        sayHint('Проскочил… попробуй немного вернуть назад.', 1.4);\n      }\n      near = close;\n    },\n\n    up() {\n      if (!dragging) return;\n      dragging = false;\n      if (A.solved()) return;\n\n      if (Math.abs(angle - target()) \u003c= tolerance()) {\n        stage++;\n        near = false;\n        if (stage >= 3) {\n          angle = maxTurn;\n          springBack = false;\n          tone([523, 659, 784], 'triangle', 0.42, 0.12);\n          sayHint('Щёлк! Ключ провернулся до конца.', 0);\n          A.solve();\n        } else {\n          tone([620, 820], 'triangle', 0.16, 0.09);\n          sayHint(stage === 1 ? 'Первый фиксатор отошёл. Ключ вернулся — ещё два.' : 'Второй фиксатор! Остался последний.', 2.4);\n          springBack = true;\n        }\n      } else {\n        near = false;\n        springBack = true;\n        tone([190], 'sawtooth', 0.13, 0.055, 125);\n        sayHint('Нет… механизм упёрся. Попробуй медленнее.', 2.1);\n      }\n    },\n\n    update(dt) {\n      clock += dt;\n      if (springBack && !dragging) {\n        angle += (0 - angle) * Math.min(1, dt * 9);\n        if (angle \u003c 0.012) {\n          angle = 0;\n          springBack = false;\n        }\n      }\n    },\n\n    draw() {\n      g.save();\n      g.beginPath(); g.rect(0, 0, A.area.w, A.area.h); g.clip();\n      drawBackground();\n      A.frame(p.name || 'Открытие замка');\n      drawLockPlate();\n      drawTurnArc();\n      drawKey();\n      drawProgress();\n      drawMessage();\n\n      if (!A.solved()) {\n        g.fillStyle = '#a99875'; g.font = '15px Georgia, serif';\n        g.textAlign = 'center'; g.textBaseline = 'middle';\n        g.fillText('Удерживай кнопку мыши и веди головку ключа по дуге вниз', cx, 535);\n      }\n      g.restore();\n    },\n\n    close() {\n      dragging = false;\n      springBack = false;\n    }\n  };\n}","note":"keymaster"},{"type":"custom","code":"(p, A, params) => {\n  // Transposed to A minor: all intervals are preserved.\n  const melody = [\n    76, 76, 76, 74, 76, 76, 76,\n    77, 76, 69, 76, 74, 74, 72\n  ];\n\n  // Approximate note lengths and rests read from the MIDI screenshot.\n  // Playback is slowed down by playbackSpeed below.\n  const noteDur = [\n    0.42, 0.24, 0.12, 0.24, 0.24,\n    0.24, 0.24, 0.42, 0.82, 0.24,\n    0.42, 0.24, 0.12, 0.24\n  ];\n\n  const noteGap = [\n    0.04, 0.04, 0.08, 0.04, 0.04,\n    0.04, 0.08, 0.04, 0.12, 0.08,\n    0.04, 0.04, 0.08, 0.04\n  ];\n\n  // Stage 1 teaches the first 7 notes; stage 2 teaches all 14 notes.\n  const stageEnds = [7, 14];\n  const names = {\n    69: 'A4',\n    72: 'C5',\n    74: 'D5',\n    76: 'E5',\n    77: 'F5'\n  };\n\n  // Each pitch has its own stable color.\n  const noteColors = {\n    69: '#F5D45C', // A4 - yellow\n    72: '#C69AEF', // C5 - purple\n    74: '#FF9666', // D5 - orange\n    76: '#5ED6A3', // E5 - mint\n    77: '#62B7F5'  // F5 - blue\n  };\n\n  const playbackSpeed = 1.6;\n  const openMidi = [64, 59, 55, 50, 45, 40]; // strings 1..6, standard tuning\n  const maxFret = 25;\n  const neck = { x: 74, y: 220, w: 1000, h: 330 };\n\n  let stage = 0;\n  let inputAt = 0;\n  let mode = 'ready';\n  let playAt = 0;\n  let playTimer = 0;\n  let playStarted = false;\n  let successTimer = 0;\n  let litNote = null;\n  let litFlashTimer = 0;\n  let litRepeat = { current: 1, total: 1 };\n  let feedback = null;\n  let feedbackTimer = 0;\n  let message = 'Нажмите «Слушать», чтобы запомнить мелодию';\n  let audio = null;\n  let voiceOsc = null;\n  let voiceGain = null;\n\n  function getAudio() {\n    if (!audio) {\n      audio = new (window.AudioContext || window.webkitAudioContext)();\n      voiceOsc = audio.createOscillator();\n      voiceGain = audio.createGain();\n      voiceOsc.type = 'sine';\n      voiceGain.gain.value = 0.0001;\n      voiceOsc.connect(voiceGain);\n      voiceGain.connect(audio.destination);\n      voiceOsc.start();\n    }\n    if (audio.state === 'suspended') audio.resume();\n    return audio;\n  }\n\n  function noteHz(midi) {\n    return 440 * Math.pow(2, (midi - 69) / 12);\n  }\n\n  // One oscillator plays one note at a time.\n  function pluck(midi, duration = 0.36) {\n    try {\n      const ac = getAudio();\n      const now = ac.currentTime;\n      const dur = Math.max(0.12, duration);\n\n      voiceGain.gain.cancelScheduledValues(now);\n      voiceGain.gain.setValueAtTime(0.0001, now);\n      voiceOsc.frequency.cancelScheduledValues(now);\n      voiceOsc.frequency.setValueAtTime(noteHz(midi), now);\n      voiceGain.gain.linearRampToValueAtTime(0.20, now + 0.008);\n      voiceGain.gain.setValueAtTime(0.20, now + Math.max(0.012, dur * 0.35));\n      voiceGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);\n    } catch (_) {\n      // Audio may be unavailable; puzzle remains playable.\n    }\n  }\n\n  function lengthNow() {\n    return stageEnds[stage] || melody.length;\n  }\n\n  function startPlayback() {\n    if (stage >= stageEnds.length) return;\n    getAudio();\n    mode = 'play';\n    playAt = 0;\n    playTimer = 0;\n    playStarted = false;\n    inputAt = 0;\n    litNote = null;\n    litFlashTimer = 0;\n    litRepeat = { current: 1, total: 1 };\n    feedback = null;\n    feedbackTimer = 0;\n    message = 'Слушайте внимательно…';\n  }\n\n  function fretX(fret) {\n    const ratio = 1 - Math.pow(2, -fret / 12);\n    const maxRatio = 1 - Math.pow(2, -maxFret / 12);\n    return neck.x + neck.w * ratio / maxRatio;\n  }\n\n  function pitchPositions(midi) {\n    const positions = [];\n    for (let s = 0; s \u003c openMidi.length; s++) {\n      const fret = midi - openMidi[s];\n      if (fret >= 1 && fret \u003c= maxFret) positions.push({ s, fret });\n    }\n    return positions;\n  }\n\n  // Pick one reference position for the live demo. The player may still use\n  // any highlighted equivalent position on another string.\n  function demoPosition(midi) {\n    const positions = pitchPositions(midi);\n    return positions.length ? positions[0] : null;\n  }\n\n  // Highlight exactly five playable cells: one fixed position for each\n  // of the five pitches used by the melody.\n  function drawUsedFretCells() {\n    const rowH = neck.h / 6;\n    const pitches = Array.from(new Set(melody));\n    g.save();\n    for (const midi of pitches) {\n      const pos = demoPosition(midi);\n      if (!pos) continue;\n      const left = fretX(pos.fret) + 2;\n      const right = fretX(pos.fret + 1) - 2;\n      const top = neck.y + rowH * pos.s + 3;\n      g.globalAlpha = 0.48;\n      g.fillStyle = noteColors[midi] || '#ffe66d';\n      g.fillRect(left, top, Math.max(2, right - left), rowH - 6);\n      g.globalAlpha = 0.95;\n      g.strokeStyle = noteColors[midi] || '#ffe66d';\n      g.lineWidth = 2;\n      g.strokeRect(left, top, Math.max(2, right - left), rowH - 6);\n    }\n    g.restore();\n  }\n\n  // Show where this repeated note sits inside its consecutive run (for example 2/3).\n  function repeatInfoAt(index) {\n    const midi = melody[index];\n    let first = index;\n    let last = index;\n    while (first > 0 && melody[first - 1] === midi) first--;\n    while (last + 1 \u003c Math.min(melody.length, lengthNow()) && melody[last + 1] === midi) last++;\n    return { current: index - first + 1, total: last - first + 1 };\n  }\n\n  function drawNoteMarker(pos, midi, radius, correct, progress = null) {\n    const rowH = neck.h / 6;\n    const x = (fretX(pos.fret) + fretX(pos.fret + 1)) / 2;\n    const y = neck.y + rowH * (pos.s + 0.5);\n\n    g.fillStyle = noteColors[midi] || '#ffe66d';\n    g.beginPath();\n    g.arc(x, y, radius, 0, Math.PI * 2);\n    g.fill();\n\n    // White outline keeps the pitch color visible against the fretboard.\n    g.strokeStyle = '#fff4d8';\n    g.lineWidth = 2;\n    g.stroke();\n\n    g.fillStyle = '#39251a';\n    g.font = 'bold 14px Arial';\n    g.textAlign = 'center';\n    g.textBaseline = 'middle';\n    g.fillText(names[midi] || '', x, y);\n\n    if (correct !== null) {\n      g.strokeStyle = correct ? '#31ef83' : '#ff4545';\n      g.lineWidth = 4;\n      g.beginPath();\n      g.arc(x, y, radius + 5, 0, Math.PI * 2);\n      g.stroke();\n\n      g.fillStyle = correct ? '#31ef83' : '#ff4545';\n      g.font = 'bold 22px Arial';\n      g.fillText(correct ? '✓' : '×', x + radius + 9, y - radius - 5);\n    }\n\n    if (progress) {\n      const countText = progress.current + '/' + progress.total;\n      g.font = 'bold 12px Arial';\n      g.textAlign = 'center';\n      g.textBaseline = 'middle';\n      g.fillStyle = '#fff4d8';\n      g.fillText(countText, x, y + radius + 8);\n    }\n  }\n\n  function drawButton(x, y, w, h, text, enabled) {\n    g.fillStyle = enabled ? '#9c7548' : '#5b5146';\n    g.fillRect(x, y, w, h);\n    g.strokeStyle = '#d7bd8c';\n    g.lineWidth = 2;\n    g.strokeRect(x, y, w, h);\n    g.fillStyle = enabled ? '#fff2d4' : '#bcb2a2';\n    g.font = '24px Arial';\n    g.textAlign = 'center';\n    g.textBaseline = 'middle';\n    g.fillText(text, x + w / 2, y + h / 2);\n  }\n\n  function drawNeck() {\n    g.fillStyle = '#39251a';\n    g.fillRect(neck.x, neck.y, neck.w, neck.h);\n    g.fillStyle = '#6b4429';\n    g.fillRect(neck.x, neck.y, neck.w, neck.h);\n\n    // Wood grain.\n    for (let i = 0; i \u003c 9; i++) {\n      g.strokeStyle = 'rgba(215,166,105,.10)';\n      g.lineWidth = 1;\n      g.beginPath();\n      g.moveTo(neck.x, neck.y + i * 39);\n      g.lineTo(neck.x + neck.w, neck.y + i * 39 + 12);\n      g.stroke();\n    }\n\n    // Only the five target string/fret cells are colored.\n    \n    drawUsedFretCells();\n\n    // Frets and fret numbers.\n    for (let f = 0; f \u003c= maxFret; f++) {\n      const x = fretX(f);\n      g.strokeStyle = f === 0 ? '#e0c18a' : '#c7b08a';\n      g.lineWidth = f === 0 ? 5 : (f % 5 === 0 ? 3 : 1.5);\n      g.beginPath();\n      g.moveTo(x, neck.y);\n      g.lineTo(x, neck.y + neck.h);\n      g.stroke();\n\n      if (f \u003c maxFret) {\n        g.fillStyle = '#e9d5ac';\n        g.font = '13px Arial';\n        g.textAlign = 'center';\n        g.fillText(String(f), (x + fretX(f + 1)) / 2, neck.y - 12);\n      }\n    }\n\n    const rowH = neck.h / 6;\n\n    // Six strings.\n    for (let s = 0; s \u003c 6; s++) {\n      const y = neck.y + rowH * (s + 0.5);\n      g.strokeStyle = '#d9c7a5';\n      g.lineWidth = [1.2, 1.7, 2.2, 2.8, 3.4, 4][s];\n      g.beginPath();\n      g.moveTo(neck.x, y);\n      g.lineTo(neck.x + neck.w, y);\n      g.stroke();\n\n      g.fillStyle = '#e8d3a8';\n      g.font = '18px Arial';\n      g.textAlign = 'right';\n      g.fillText(String(s + 1), neck.x - 14, y + 6);\n    }\n\n    // Fretboard markers.\n    [3, 5, 7, 9, 12, 15, 17, 19, 21, 24].forEach(f => {\n      const x = (fretX(f) + fretX(f + 1)) / 2;\n      const y = neck.y + rowH * 3;\n      g.fillStyle = 'rgba(235,215,175,.28)';\n\n      if (f === 12 || f === 24) {\n        g.beginPath();\n        g.arc(x, neck.y + rowH * 2, 8, 0, Math.PI * 2);\n        g.fill();\n        g.beginPath();\n        g.arc(x, neck.y + rowH * 4, 8, 0, Math.PI * 2);\n        g.fill();\n      } else {\n        g.beginPath();\n        g.arc(x, y, 8, 0, Math.PI * 2);\n        g.fill();\n      }\n    });\n\n    // During the demo, pulse exactly one colored fret cell. Repeated notes\n    // restart the pulse and the count is shown in the status line and on the cell.\n    if (mode === 'play' && litNote !== null) {\n      const pos = demoPosition(litNote);\n      if (pos) {\n        const x = (fretX(pos.fret) + fretX(pos.fret + 1)) / 2;\n        const y = neck.y + rowH * (pos.s + 0.5);\n        const flash = Math.max(0, 1 - litFlashTimer / 0.38);\n        if (flash > 0) {\n          g.strokeStyle = '#fff4d8';\n          g.lineWidth = 2 + flash * 2;\n          g.beginPath();\n          g.arc(x, y, 18 + (1 - flash) * 14, 0, Math.PI * 2);\n          g.stroke();\n        }\n        drawNoteMarker(pos, litNote, 12 + flash * 3, null, litRepeat);\n      }\n    }\n\n    // Player feedback: pitch color plus green/red ring after each click.\n    if ((mode === 'input' || mode === 'advance') && feedback && feedbackTimer > 0) {\n      drawNoteMarker(feedback, feedback.midi, 14, feedback.correct, feedback.repeat);\n    }\n  }\n\n  function draw() {\n    A.frame(p.name || 'Мелодия');\n    g.fillStyle = '#e6cd96';\n    g.textAlign = 'center';\n    g.textBaseline = 'middle';\n    g.font = '28px Arial';\n\n    if (stage \u003c stageEnds.length) {\n      g.fillText('Этап ' + (stage + 1) + ' из ' + stageEnds.length + ' · нот в мелодии: ' + lengthNow(), W / 2, 90);\n    } else {\n      g.fillText('Мелодия выучена!', W / 2, 90);\n    }\n\n    g.font = '21px Arial';\n    g.fillText(message, W / 2, 142);\n    drawNeck();\n\n    drawButton(360, 600, 190, 56, '▶ Слушать', mode !== 'play' && stage \u003c stageEnds.length);\n    drawButton(590, 600, 210, 56, '↻ Повторить', mode !== 'play' && stage \u003c stageEnds.length);\n\n    g.fillStyle = '#e6cd96';\n    g.font = '18px Arial';\n    g.textAlign = 'center';\n    g.fillText(\n      mode === 'input'\n        ? ('Повтор: ' + inputAt + ' / ' + lengthNow())\n        : 'Нажимайте на струну и лад, чтобы сыграть ноту',\n      W / 2,\n      690\n    );\n\n    // Pitch-color legend. The same colors fill the playable fret cells.\n    g.fillStyle = '#e6cd96';\n    g.font = '13px Arial';\n    g.textAlign = 'center';\n    g.fillText('Пять цветных ячеек — пять нужных нот', W / 2, 558);\n    const legend = [69, 72, 74, 76, 77];\n    const totalW = 5 * 92;\n    let lx = W / 2 - totalW / 2;\n    const ly = 575;\n    for (const midi of legend) {\n      g.fillStyle = noteColors[midi];\n      g.beginPath();\n      g.arc(lx + 10, ly, 7, 0, Math.PI * 2);\n      g.fill();\n      g.fillStyle = '#e6cd96';\n      g.font = '15px Arial';\n      g.textAlign = 'left';\n      g.fillText(names[midi], lx + 23, ly);\n      lx += 92;\n    }\n  }\n\n  function click(x, y) {\n    if (stage >= stageEnds.length || mode === 'play' || mode === 'advance') return;\n\n    // Play/replay buttons.\n    if (y >= 590 && y \u003c= 665) {\n      if (x >= 340 && x \u003c= 570) {\n        startPlayback();\n        return;\n      }\n      if (x >= 580 && x \u003c= 820) {\n        startPlayback();\n        return;\n      }\n    }\n\n    if (\n      mode !== 'input' ||\n      x \u003c fretX(1) ||\n      x > neck.x + neck.w ||\n      y \u003c neck.y ||\n      y > neck.y + neck.h\n    ) return;\n\n    const row = Math.floor((y - neck.y) / (neck.h / 6));\n    let fret = 1;\n\n    for (let f = 1; f \u003c= maxFret; f++) {\n      const left = fretX(f);\n      const right = fretX(f + 1);\n      if (x >= left && x \u003c= right) {\n        fret = f;\n        break;\n      }\n      if (x > right) fret = f;\n    }\n\n    const midi = openMidi[row] + fret;\n    pluck(midi, 0.36);\n\n    const expectedIndex = inputAt;\n    const expected = melody[expectedIndex];\n    const expectedRepeat = repeatInfoAt(expectedIndex);\n    const targetPosition = demoPosition(expected);\n    // Only the five visibly highlighted cells are accepted, so the visual\n    // guide and the input check always refer to the same exact fret positions.\n    const correct = midi === expected && targetPosition &&\n      targetPosition.s === row && targetPosition.fret === fret;\n    const shownRepeat = correct\n      ? expectedRepeat\n      : { current: 0, total: expectedRepeat.total };\n\n    feedback = { s: row, fret, midi, correct, repeat: shownRepeat };\n    feedbackTimer = 0.9;\n\n    if (correct) {\n      inputAt++;\n      message = 'Верно! ' + (names[midi] || '') + ' · ' +\n        expectedRepeat.current + '/' + expectedRepeat.total;\n\n      if (inputAt >= lengthNow()) {\n        mode = 'advance';\n        successTimer = 0;\n        message = stage === stageEnds.length - 1 ? 'Вся мелодия сыграна!' : 'Этап пройден!';\n      }\n    } else {\n      inputAt = 0;\n      message = 'Не та нота: ' + (names[midi] || '') + ' · сброс 0/' + expectedRepeat.total;\n    }\n  }\n\n  function update(dt) {\n    if (feedbackTimer > 0) {\n      feedbackTimer = Math.max(0, feedbackTimer - dt);\n      if (feedbackTimer === 0) feedback = null;\n    }\n\n    if (mode === 'play') {\n      if (!playStarted) {\n        litNote = melody[playAt];\n        litFlashTimer = 0;\n        litRepeat = repeatInfoAt(playAt);\n        message = 'Слушайте: ' + (names[litNote] || '') + ' · ' +\n          litRepeat.current + '/' + litRepeat.total;\n        pluck(litNote, (noteDur[playAt] || 0.28) * playbackSpeed);\n        playStarted = true;\n        playTimer = 0;\n      } else {\n        litFlashTimer += dt;\n        playTimer += dt;\n        const currentDuration = (noteDur[playAt] || 0.28) * playbackSpeed;\n        const currentGap = (noteGap[playAt] || 0.06) * playbackSpeed;\n\n        if (playTimer >= currentDuration + currentGap) {\n          playAt++;\n          playStarted = false;\n          playTimer = 0;\n\n          if (playAt >= lengthNow()) {\n            mode = 'input';\n            inputAt = 0;\n            litNote = null;\n            litFlashTimer = 0;\n            feedback = null;\n            feedbackTimer = 0;\n            message = 'Теперь повторите последовательность кликами по грифу';\n          }\n        }\n      }\n    } else if (mode === 'advance') {\n      successTimer += dt;\n\n      if (successTimer >= 1.3) {\n        stage++;\n        inputAt = 0;\n        litNote = null;\n        litFlashTimer = 0;\n        feedback = null;\n        feedbackTimer = 0;\n\n        if (stage >= stageEnds.length) {\n          mode = 'done';\n          A.solve();\n          message = 'Головоломка пройдена!';\n        } else {\n          mode = 'ready';\n          message = 'Этап ' + (stage + 1) + '. Нажмите «Слушать»';\n        }\n      }\n    }\n  }\n\n  return {\n    open() {\n      stage = 0;\n      inputAt = 0;\n      mode = 'ready';\n      litNote = null;\n      litFlashTimer = 0;\n      litRepeat = { current: 1, total: 1 };\n      feedback = null;\n      feedbackTimer = 0;\n      message = 'Нажмите «Слушать», чтобы запомнить мелодию';\n    },\n\n    draw,\n    click,\n    update,\n\n    close() {\n      try {\n        if (voiceOsc) voiceOsc.stop();\n      } catch (_) {}\n\n      try {\n        if (audio && audio.state !== 'closed') audio.close();\n      } catch (_) {}\n\n      audio = null;\n      voiceOsc = null;\n      voiceGain = null;\n    }\n  };\n}\n","note":""}]};</script><script>/* тип головоломки «custom2» */
PUZZLES["custom2"]=(
// Тип головоломки: функция (p, A, params) → объект-экземпляр. Спецификация — «? Справка» и документ для разработчика.
// Тип головоломки: keymaster
// Зажать круглую головку ключа, повернуть её вниз по дуге и отпустить,
// когда внутри замка появится короткий металлический щелчок.
(p, A, params) => {
  const cx = A.area.w / 2;
  const cy = 345;
  const maxTurn = 1.16;
  const targets = [0.34, 0.70, 1.04];
  const tolerances = [0.060, 0.052, 0.045];
  const keyRadius = 207;

  let stage = 0;
  let angle = 0;
  let dragging = false;

function drawPlayer(sc){const n=Math.floor(S.walk/.33)%2+1,dir=M().framesDir||'images/character/',i=img(dir+(S.dir>0?'right':'left')+n+'.png');if(!i)return;const k=sc.playerScale||1,w=222*k,h=318*k;g.drawImage(i,S.px-w/2,(sc.playerY||700)-h,w,h)}
function bubblePos(b){const sc=cur()||{},sp=whoById(b.who)||{};let x=b.bx??sp.bx,y=b.by??sp.by;
 if(x==null||y==null){if(b.who==='zet'||sp.plain){x=x??sc.bubbleX??(S.px-50);y=y??sc.bubbleY??100}else{x=x??W/2-150;y=y??100}}
 return[Math.max(20,Math.min(W-320,x)),Math.max(20,Math.min(H-300,y))]}
function drawBubble(){const b=S.bubble,sp=whoById(b.who)||{},t=sp.plain||!sp.name?b.text:sp.name+': "'+b.text+'"',[bx,by]=bubblePos(b),v=img(M().voice);
 if(v)g.drawImage(v,bx,by,300,238);else{g.fillStyle='rgba(22,16,9,.93)';g.strokeStyle='#e6cd96';g.lineWidth=3;g.beginPath();g.rect(bx,by,300,200);g.fill();g.stroke()}
 g.font='32px "Amatic SC"';g.fillStyle='#f1e2bd';g.textAlign='center';g.textBaseline='middle';let L=wrap(t,210),lh=28;if(L.length>5){g.font='26px "Amatic SC"';L=wrap(t,230);lh=24}
 L.forEach((l,i)=>g.fillText(l,bx+150,by+100+(i-(L.length-1)/2)*lh));g.textAlign='left'}
function draw(t){g.clearRect(0,0,W,H);g.textBaseline='alphabetic';g.textAlign='left';
 if(S.scene==='loading'||S.scene==='splash'){g.fillStyle='#000';g.fillRect(0,0,W,H);g.font='60px "Amatic SC"';g.fillStyle='rgba(238,220,180,'+(.55+.45*Math.sin(t/400))+')';g.textAlign='center';g.textBaseline='middle';g.fillText(S.scene==='loading'?'Загрузка…':'Нажмите, чтобы начать',W/2,H/2);g.textAlign='left'}
 else if(S.scene==='menu'){const i=img(M().menuImage);if(i)g.drawImage(i,0,0,W,H)}
 else{const sc=cur();if(sc){const bg=img(sc.bg);if(bg)g.drawImage(bg,0,0,W,H);else{g.fillStyle='#000';g.fillRect(0,0,W,H)}
  for(const s of sc.sprites)if(cond(s.showIf))drawSprite(s);
  if(sc.mode==='side')drawPlayer(sc);
  for(const a of sc.arrows)if(cond(a.showIf))arrow(a.x,a.y,a.dir,t);
  if(S.puzzle)drawPuzzle();
  S.inv.forEach((id,i)=>{if(id!==S.held)icon(id,SX[i],SY,84);const it=itemById(id);if(it&&it.counterFlag){const n='x'+Math.floor((+S.flags[it.counterFlag]||0)/(it.counterDiv||1));g.save();g.font='28px "Amatic SC"';g.fillStyle='#ffe28a';g.strokeStyle='#2a2010';g.lineWidth=4;g.textAlign='center';g.textBaseline='middle';g.strokeText(n,SX[i]+34,SY+30);g.fillText(n,SX[i]+34,SY+30);g.restore()}})}}
 if(S.bubble&&!S.wait)drawBubble();
 if(S.held)icon(S.held,S.mx+30,S.my+30,72);
 if(S.wait){if(S.wait.caption){g.font='48px "Amatic SC"';g.fillStyle='#e6cd96';g.textAlign='center';g.textBaseline='middle';g.fillText(S.wait.caption,W/2,H-120);g.textAlign='left'}}
 else{const c=img(M().cursor);g.save();g.translate(S.mx,S.my);if(S.down)g.rotate(-.35);if(c)g.drawImage(c,-6,-6,50,50);else{g.fillStyle='#e6cd96';g.beginPath();g.moveTo(0,0);g.lineTo(18,8);g.lineTo(8,18);g.fill()}g.restore()}
 if(S.fade){g.fillStyle='rgba(0,0,0,'+S.fade.a+')';g.fillRect(0,0,W,H)}
 if(S.dbg)drawDbg()}
let stepA=null;
function update(dt){if(S.fade){const f=S.fade;f.a+=f.ph*dt/.6;if(f.ph===1&&f.a>=1){f.a=1;f.ph=-1;f.cb()}else if(f.ph===-1&&f.a<=0)S.fade=null}
 const sc=cur();let moving=false;if(sc&&sc.mode==='side'&&!S.wait&&!S.puzzle){const d=S.tx-S.px;if(Math.abs(d)>3){S.dir=d>0?1:-1;S.px+=S.dir*Math.min(Math.abs(d),170*dt);S.walk+=dt;moving=true}else S.walk=0}else S.walk=0;
 if(M().stepSound){stepA=stepA||aud(M().stepSound);if(moving&&stepA.paused){stepA.loop=true;stepA.volume=.6;stepA.play().catch(()=>{})}else if(!moving&&!stepA.paused){stepA.pause();stepA.currentTime=0}}
 if(S.puzzle)pcall('update',dt)}
function loop(t){const dt=Math.min(.05,(t-S.last)/1000||0);S.last=t;update(dt);draw(t);requestAnimationFrame(loop)}

/* ---------- ввод и запуск ---------- */
function fit(){const k=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
function pos(e){const r=cv.getBoundingClientRect();S.mx=(e.clientX-r.left)*W/r.width;S.my=(e.clientY-r.top)*H/r.height}
addEventListener('resize',fit);addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{pos(e);if(S.puzzle)pcall('move',S.mx,S.my)});
addEventListener('mouseup',()=>{S.down=false;if(S.puzzle)pcall('up',S.mx,S.my)});
addEventListener('mousedown',e=>{pos(e);if(S.scene!=='loading')down(S.mx,S.my)});
S.dbuf='';addEventListener('keydown',e=>{if(!P)return;const code=String(M().debugCode??'178500');
 if(e.key==='Escape'&&S.dbg){S.dbg=false;return}
 if(S.dbg&&/^[1-9]$/.test(e.key)){const sc=P.scenes[+e.key-1];if(sc)dbgEnter(sc.id);return}
 if(S.puzzle&&!S.dbg){if(e.key==='Escape'){exitPuzzle();return}pcall('key',e.key,e)}
 if(code&&/^[0-9]$/.test(e.key)){S.dbuf=(S.dbuf+e.key).slice(-code.length);if(S.dbuf===code&&S.scene!=='loading'){S.dbuf='';S.dbg=true;S.held=null;return}}
 if(S.scene==='splash')click(0,0)});
async function boot(data){P=data;fit();S.scene='loading';requestAnimationFrame(loop);
 try{const f=new FontFace('Amatic SC','url("'+url(M().font||'fonts/AmaticSC-Regular.ttf')+'")');document.fonts.add(await f.load())}catch(e){}
 const paths=new Set([M().menuImage,M().cursor,M().voice]);const fd=M().framesDir||'images/character/';['left1','left2','right1','right2'].forEach(n=>paths.add(fd+n+'.png'));
 P.items.forEach(i=>paths.add(i.icon));P.scenes.forEach(sc=>{paths.add(sc.bg);sc.sprites.forEach(s=>paths.add(s.img))});P.puzzles.forEach(p=>p.params&&paths.add(p.params.bg));
 await Promise.all([...paths].filter(Boolean).map(loadImg));
 const h=decodeURIComponent(window.START_HASH||location.hash.slice(1));
 if(h.startsWith('pz=')){const id=h.slice(3),calls=P.scenes.filter(sc=>JSON.stringify(sc).includes('"puzzle":"'+id+'"'));S.scene='';startGame((calls[0]||{}).id||M().startScene);S.bubble=null;S.queue=[];openPuzzle(id)}
 else if(h&&sceneById(h)){S.scene='';startGame(h)}else S.scene='splash'}
window.GAME={S,P:()=>P,startGame,enterScene,openPuzzle,exitPuzzle,PZ,PUZZLES,dbgEnter};
if(window.LEVELS)boot(window.LEVELS);else fetch('levels.json').then(r=>r.json()).then(boot).catch(e=>{document.body.innerHTML='<p style="color:#e6cd96;font:20px sans-serif;padding:20px">Нет данных уровней: встроенных нет и levels.json не загрузился ('+e.message+')</p>'});

</script></body></html>
