function beep(){try{AC=AC||new AudioContext();const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime;o.type='square';o.frequency.value=900;v.gain.setValueAtTime(.08,t);v.gain.exponentialRampToValueAtTime(.001,t+.06);o.connect(v);v.connect(AC.destination);o.start();o.stop(t+.07)}catch(e){}}

function playChordSound(name) {
    try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        const freqs = {
            'Am': [220.00, 261.63, 329.63],
            'F': [174.61, 220.00, 261.63],
            'C': [130.81, 164.81, 196.00],
            'E': [164.81, 207.65, 246.94]
        };
        const notes = freqs[name];
        if (!notes) return;
        const t = AC.currentTime;
        notes.forEach(f => {
            const o = AC.createOscillator(), v = AC.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(f, t);
            v.gain.setValueAtTime(0.15, t);
            v.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
            o.connect(v); v.connect(AC.destination);
            o.start(t); o.stop(t + 1.2);
        });
    } catch(e) {}
}
function playErrorSound() {
    try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        const t = AC.currentTime;
        const o = AC.createOscillator(), v = AC.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(80, t + 0.3);
        v.gain.setValueAtTime(0.2, t);
        v.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.connect(v); v.connect(AC.destination);
        o.start(t); o.stop(t + 0.3);
    } catch(e) {}
}

addEventListener('keydown',e=>{
 if(e.key==='Escape'){S.dbg=false;S.dbuf='';return}
 if(/^[0-9]$/.test(e.key)){
   S.dbuf=(S.dbuf+e.key).slice(-DBG_CODE.length);
   if(S.dbuf===DBG_CODE){dbgStopAll();S.dbg=true;S.dbuf=''}
 } else if(S.dbg&&/^[1-9]$/.test(e.key)){
   const idx=parseInt(e.key)-1;if(DBG_KEYS[idx])dbgEnterLevel(DBG_KEYS[idx]);
 }
});

addEventListener('mousedown',e=>{
    pos(e);S.down=true;ensureMusic();if(S.fade)return;
    if(S.tsoyPlaying || S.concertPlaying) return;
    if(S.bubble && S.queue.length){const q=S.queue.shift();say(q.t,q.cx,q.cy);if(q.fn)q.fn();return;}
    if(S.bubble) { S.bubble = null; S.bubbleCX = undefined; S.bubbleCY = undefined; }
    if(S.puzzleActive){
        if(S.my > 745) { click(S.mx, S.my); }
        else {
            if(S.puzzleKind==='hp')hpDown(S.mx,S.my);
            else if(S.puzzleKind==='chord')clickChord(S.mx,S.my);
            else clickPuzzle(S.mx, S.my);
        }

    }

});

function say(t, cx, cy){
    if(S.scene && S.scene.indexOf('back6')===0){ cx=20; if(cy===undefined)cy=100; }
    if(cx !== undefined) { cx = Math.max(20, Math.min(W - 320, cx)); }
    if(cy !== undefined) { cy = Math.max(20, Math.min(H - 300, cy)); }
    S.bubble=t; S.bubbleCX=cx; S.bubbleCY=cy;
}

function startTsoy(){
  clearTimeout(S.tsoyTimer);
  tsoy.onended = null;

  const firstPlay = !S.tsoyStarted;

  S.tsoyStarted = true;
  S.tsoyPlaying = true;

  theme2.volume = .05;
  busSnd.volume = .35;

  tsoy.pause();
  tsoy.currentTime = 0;
  tsoy.volume = 1.0;

  const restoreAfterTsoy = () => {
    S.tsoyPlaying = false;
    busSnd.volume = .7;

    if(S.scene === 'l7' && !S.puzzleActive){
      theme2.volume = .25;
      S.tsoyComplete = true;
    }
  };

  if(firstPlay){
    tsoy.onended = () => {
      restoreAfterTsoy();
      if(S.scene === 'l7' && !S.puzzleActive){
        say('Дед: "Что ты там брякаешь? Из-за автобуса ничего не слышно!"', 520, 100);
      }
    };
    tsoy.play().catch(()=>{});
  } else {
    S.tsoyTimer = setTimeout(() => {
      tsoy.pause();
      tsoy.currentTime = 0;
      restoreAfterTsoy();
      if(S.scene === 'l7' && !S.puzzleActive){
        say('Дед: "Плохо слышишь чтоль? Не слышно гитару, говорю!"', 520, 100);
      }
    }, 5000);
    tsoy.play().catch(()=>{});
  }
}

function combine(h,o){
 if([h,o].includes('mediator')&&[h,o].includes('guitar')){
   if(S.scene!=='l7'){say(NOPE, S.px - 50, 100);return}
   if(S.chordSolved){say('Я уже вспомнил эту мелодию.', S.px - 50, 100);return}
   if(!S.tsoyComplete){say('Сначала надо сыграть, чтобы вспомнить мелодию...', S.px - 50, 100);return}
   tsoy.pause();
   tsoy.currentTime=0;
   theme2.volume=.25;
   initChordPuzzle();
   say('Как там играется народная любимая песня? Надо быстро подобрать', S.px - 50, 100);
   return;
 }
 if([h,o].includes('matches')&&[h,o].includes('brokenmediator')){
  S.inv[S.inv.indexOf('brokenmediator')]='mediator';beep();
  say('Подогрел над спичкой, и пластик размяк. Теперь медиатор можно выровнять. Им ведь не только на гитаре играют, но и разбирают пластиковые корпуса, как лопаточкой.', S.px - 50, 100);return}
 const hk=[h,o].find(v=>v=='hanky'||v=='wethanky');
 if(hk&&[h,o].includes('dirtbottle')){
  if(hk=='wethanky'){
    S.inv[S.inv.indexOf('dirtbottle')]='cleanbottle';
    S.inv.splice(S.inv.indexOf('wethanky'), 1);
    say('Ну вот вчерашний слой грязи наконец убран. Платок изгваздался, выброшу его.', S.px - 50, 100);beep()
  }
  else say('Грязь присохла. Платок пачкается, а бутылка чище не становится.', S.px - 50, 100)
 }else say(NOPE, S.px - 50, 100)
}

const P_SIZE = 75;
const P_OX = 40;
const P_OY = 20;

function getConns(t, r) {
    if (t===1) return [r%2===0?['L','R']:['U','D']][0];
    if (t===2) return [['U','R'],['R','D'],['D','L'],['L','U']][r%4];
    if (t===3) return [['L','R','U'],['U','D','R'],['L','R','D'],['U','D','L']][r%4];
    if (t===4) return ['L','R','U','D'];
    if (t===5) return ['R'];
    if (t===6) return ['R'];
    if (t===8) return S.key_in_puzzle ? ['U','L','R'] : [];
    return [];
}

function checkPuzzle() {
    const visited = new Set();
    const q = [[0, 0]];
    visited.add('0,0');
    let isSolved = false;
    let current = 0;
    const dirs = { 'U': [0, -1, 'D'], 'D': [0, 1, 'U'], 'L': [-1, 0, 'R'], 'R': [1, 0, 'L'] };

    while(current < q.length) {
        const [cx, cy] = q[current++];
        if (cx === 0 && cy === 8) isSolved = true;
        const cell = puzzleGrid[cy][cx];
        if(!cell) continue;
        const conns = getConns(cell.t, cell.r);
        for (let c of conns) {
            const nx = cx + dirs[c][0], ny = cy + dirs[c][1];
            if (nx >= 0 && nx < 9 && ny >= 0 && ny < 9 && !visited.has(`${nx},${ny}`)) {
                const nCell = puzzleGrid[ny][nx];
                if(!nCell) continue;
                const nConns = getConns(nCell.t, nCell.r);
                if (nConns.includes(dirs[c][2])) {
                    visited.add(`${nx},${ny}`);
                    q.push([nx, ny]);
                }
            }
        }
    }
    return { solved: isSolved, powered: visited };
}

function clickPuzzle(x, y) {
    if (x > 40 && x < 140 && y > 715 && y < 745) {
        S.puzzleActive = false;
        if (S.scene === 'l4' && S.puzzleSolved) { startL5(S.px); }
        else if (S.scene === 'l5' && !S.puzzleSolved) { startL4(S.px); }
        return;
    }
    const cx = Math.floor((x - P_OX) / P_SIZE);
    const cy = Math.floor((y - P_OY) / P_SIZE);
    if (cx < 0 || cx >= 9 || cy < 0 || cy >= 9) return;
    const cell = puzzleGrid[cy][cx];
    if (cell.t === 8) {
        if (S.key_in_puzzle) {
            S.key_in_puzzle = false; S.inv.push('key'); beep();
            say('Забрал ключ. Цепь разомкнута.', x - 150, y - 150);
            const res = checkPuzzle();
            if (S.puzzleSolved && !res.solved) S.puzzleSolved = false;
        } else if (S.held === 'key') {
            S.inv.splice(S.inv.indexOf('key'), 1); S.held = null; S.key_in_puzzle = true; beep();
            say('Вот теперь контакт есть. На обратном пути заберу.', x - 150, y - 150);
            const res = checkPuzzle();
            if (res.solved && !S.puzzleSolved) {
                S.puzzleSolved = true;
                say('Цепь замкнута! Светофор снова работает. Нажмите ВЫХОД.', x - 150, y - 150);
            }
        } else { say('Здесь выгорели провода. Нужна перемычка.', x - 150, y - 150); }
        return;
    }
    if ([1,2,3,4].includes(cell.t)) {
        cell.r = (cell.r + 1) % 4; beep();
        const res = checkPuzzle();
        if (res.solved && !S.puzzleSolved) {
            S.puzzleSolved = true;
            say('Цепь замкнута! Светофор снова работает. Нажмите ВЫХОД.', x - 150, y - 150);
        } else if (!res.solved && S.puzzleSolved) {
            S.puzzleSolved = false;
            say('Светофор погас. Похоже, я что-то не так подключил.', x - 150, y - 150);
        }
    }
}

function drawPuzzle() {
    g.save(); g.beginPath(); g.rect(0, 0, W, 745); g.clip();
    g.fillStyle = '#000'; g.fillRect(0, 0, W, 745);
    if (IMG.puzzle_bg && IMG.puzzle_bg.width > 0) g.drawImage(IMG.puzzle_bg, 0, 0, W, 745);
    const result = checkPuzzle();
    for (let y = 0; y < 9; y++) {
        for (let x = 0; x < 9; x++) {
            const cell = puzzleGrid[y][x];
            if(!cell) continue;
            const px = P_OX + x * P_SIZE + P_SIZE/2;
            const py = P_OY + y * P_SIZE + P_SIZE/2;
            g.save(); g.translate(px, py); g.rotate(cell.r * Math.PI / 2);
            g.lineWidth = 8; g.lineCap = 'round';
            const isPowered = result.powered.has(`${x},${y}`);
            g.strokeStyle = isPowered ? '#ffaa00' : '#4fa8e8';
            if (isPowered) { g.shadowColor = '#ffaa00'; g.shadowBlur = 10; }
            else { g.shadowColor = '#4fa8e8'; g.shadowBlur = 5; }
            g.beginPath();
            if (cell.t === 1) { g.moveTo(-P_SIZE/2, 0); g.lineTo(P_SIZE/2, 0); }
            else if (cell.t === 2) { g.moveTo(0, -P_SIZE/2); g.lineTo(0, 0); g.lineTo(P_SIZE/2, 0); }
            else if (cell.t === 3) { g.moveTo(-P_SIZE/2, 0); g.lineTo(P_SIZE/2, 0); g.moveTo(0, 0); g.lineTo(0, -P_SIZE/2); }
            else if (cell.t === 4) { g.moveTo(-P_SIZE/2, 0); g.lineTo(P_SIZE/2, 0); g.moveTo(0, -P_SIZE/2); g.lineTo(0, P_SIZE/2); }

function segX(a,b,c,d){const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));return o(a,b,c)*o(a,b,d)<0&&o(c,d,a)*o(c,d,b)<0}
function hpCross(){

 for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){
  const [a,b]=E[i],[cc,d]=E[j];if(a==cc||a==d||b==cc||b==d)continue;
  if(segX(n[a],n[b],n[cc],n[d])){c++;bad.add(i);bad.add(j)}}
 return {c,bad}}

  for(let i=0;i<10;i++)nodes.push({x:260+rnd()*640,y:140+rnd()*500,pin:null});
  nodes[0]={x:150,y:390,pin:'ВХОД'};nodes[8]={x:1000,y:390,pin:'ДИНАМИК'};
  let ok=true;
  for(let i=0;i<10&&ok;i++)for(let j=i+1;j<10;j++)if(Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y)<85){ok=false;break}
  if(!ok)continue;
  S.hp={nodes,edges:HP_EDGES.map((e,i)=>[e[0],e[1],HP_COL[i%6]]),solved:false};
  if(hpCross().c>=9)return;
 }
 S.hp={nodes,edges:HP_EDGES.map((e,i)=>[e[0],e[1],HP_COL[i%6]]),solved:false};

const CHORD_BTNS=[{n:'Am',x:220},{n:'F',x:390},{n:'C',x:560},{n:'E',x:730}];

function updateChord(dt){
 const c=S.chord;
 if(!c||c.solved)return;
 c.time+=dt;
 const interval=Math.max(.55,1.15-c.score*.035);
 const speed=220+c.score*14;
 if(c.time-c.lastSpawn>interval){
   c.lastSpawn=c.time;
   c.notes.push({type:c.seq[Math.floor(Math.random()*4)],x:W+60,hit:false});
 }
 for(const n of c.notes)n.x-=speed*dt;
 c.notes=c.notes.filter(n=>n.x>-100);
}

function clickChord(x,y){
 const c=S.chord;
 if(!c)return;
 if(x>40&&x<140&&y>715&&y<745){
   if(c.solved)startLetov();
   else{
     S.puzzleActive=false; S.puzzleKind=null; S.chord=null;
     theme2.volume=.7; tsoy.pause();
     say('Так, надо ещё подготовиться...', S.px - 50, 100);
   }
   return;
 }
 if(c.solved)return;
 for(const b of CHORD_BTNS){
   if(x>b.x-65&&x<b.x+65&&y>620&&y<700){
     const noteHalf=45;
     const inZone=c.notes.find(n=>!n.hit&&n.x+noteHalf>310&&n.x-noteHalf<410);
     if(inZone&&inZone.type===b.n&&b.n===c.seq[c.target]){
       inZone.hit=true;
       c.notes=c.notes.filter(n=>n!==inZone);
       c.score++; c.target=(c.target+1)%4; c.feedback='+1';
       playChordSound(b.n);
       if(c.score>=16){ c.solved=true; S.chordSolved=true; say('Вспомнил!', W/2 - 150, 100); }
     }else{
       c.score=0; c.target=0; c.notes=[]; c.lastSpawn=c.time; c.feedback='Ошибка!';
       playErrorSound();
     }
     return;
   }
 }
}

  // Облачко рисуем нормально, хвост смотрит влево (к Зету за экраном)
  drawImageSafe(IMG.voice,bx,by,300,238);

  g.font='32px "Amatic SC"';g.fillStyle='#f1e2bd';g.textAlign='center';g.textBaseline='middle';
  let L=wrap(S.bubble,210),lh=28;if(L.length>5){g.font='26px "Amatic SC"';L=wrap(S.bubble,230);lh=24}
  L.forEach((l,i)=>g.fillText(l,bx+150,by+100+(i-(L.length-1)/2)*lh));g.textAlign='left';
 }

 if(S.held && S.scene!=='l7end')icon(S.held,S.mx+30,S.my+30,72);

 if(S.tsoyPlaying || S.concertPlaying){
    g.font='48px "Amatic SC"'; g.fillStyle='#e6cd96'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText('Зет играет...', W/2, H - 120);
    g.textAlign='left'; g.textBaseline='top';
 } else {
    g.save();g.translate(S.mx,S.my);if(S.down)g.rotate(-.35);drawImageSafe(IMG.cursor,-6,-6,50,50);g.restore();
 }

 if(S.fade){g.fillStyle='rgba(0,0,0,'+S.fade.a+')';g.fillRect(0,0,W,H)}
}
function loop(t){const dt=Math.min(.05,(t-S.last)/1000||0);S.last=t;update(dt);draw(t);requestAnimationFrame(loop)}
init();
</script></body></html>
